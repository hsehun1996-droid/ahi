name: Build Windows EXE

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          pip install customtkinter CTkMessagebox darkdetect packaging
          pip install Pillow reportlab openpyxl
          pip install pyinstaller
          pip install pywin32

      - name: Build EXE with PyInstaller
        shell: cmd
        run: |
          pyinstaller highway.spec --noconfirm

      - name: Verify build output
        shell: cmd
        run: |
          dir dist\고속도로_포장유지보수_관리\

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\고속도로_포장유지보수_관리\*" `
            -DestinationPath "dist\고속도로_포장유지보수_관리.zip" `
            -Force

      - name: Upload EXE folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: 고속도로_포장유지보수_관리
          path: dist\고속도로_포장유지보수_관리\
          retention-days: 30

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: 고속도로_포장유지보수_관리_zip
          path: dist\고속도로_포장유지보수_관리.zip
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist\고속도로_포장유지보수_관리.zip
          generate_release_notes: true
